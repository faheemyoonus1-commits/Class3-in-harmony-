<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>In Harmony Unit 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a hardbound textbook sitting on a painted scene. The scene behind it changes with every tab; pages turn with a 3D flip. */
:root{
  --bg:#cfe7f7; --paper:#fffcf3; --paper-2:#f4ecd6; --ink:#1f2a44; --muted:#586180; --line:#e0d5b6;
  --accent:#a3197f; --accent-ink:#ffffff; --blue:#2b3990; --lime:#b5d334; --orange:#e9791a;
  --good:#1b6e34; --good-bg:#e1f3e5; --bad:#a8231b; --bad-bg:#fde7e4; --warn-bg:#fff0c4;
  --ml-bg:#ecf0ff; --ml-ink:#27348b; --hl:#fde9f6; --tip-bg:#1f2a44; --tip-ink:#ffffff;
  --veil:rgba(0,0,0,0); --cover:#2b3990; --edge1:#fffaf0; --edge2:#d8cdae; --shadow:rgba(20,25,50,.35);
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --mlf:'Noto Sans Malayalam','Kartika','Nirmala UI',sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1426; --paper:#1d2236; --paper-2:#262c45; --ink:#ecf0fb; --muted:#a6afcb; --line:#3a4165;
    --accent:#ee6ccb; --accent-ink:#2a0720; --blue:#a9b6ff; --lime:#c7e24a; --orange:#ffa04d;
    --good:#7fdc9a; --good-bg:#16301f; --bad:#ff9a92; --bad-bg:#3a1b19; --warn-bg:#3b3315;
    --ml-bg:#2a3158; --ml-ink:#cdd6ff; --hl:#3a2a45; --tip-bg:#f4f0e1; --tip-ink:#1d2236;
    --veil:rgba(8,10,24,.58); --cover:#1c2566; --edge1:#2d3350; --edge2:#171b2e; --shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1426; --paper:#1d2236; --paper-2:#262c45; --ink:#ecf0fb; --muted:#a6afcb; --line:#3a4165;
  --accent:#ee6ccb; --accent-ink:#2a0720; --blue:#a9b6ff; --lime:#c7e24a; --orange:#ffa04d;
  --good:#7fdc9a; --good-bg:#16301f; --bad:#ff9a92; --bad-bg:#3a1b19; --warn-bg:#3b3315;
  --ml-bg:#2a3158; --ml-ink:#cdd6ff; --hl:#3a2a45; --tip-bg:#f4f0e1; --tip-ink:#1d2236;
  --veil:rgba(8,10,24,.58); --cover:#1c2566; --edge1:#2d3350; --edge2:#171b2e; --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scenes{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.scene.on{opacity:1}
.scene svg{width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;background:var(--veil)}
.rain{animation:rain .55s linear infinite}
@keyframes rain{to{transform:translate(-16px,44px)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  max-width:900px;margin:10px auto 0;padding:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px -8px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.unit{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:2px 9px 4px;text-align:center;line-height:1.05;font-family:var(--display);font-weight:800}
.unit small{display:block;font-size:.62rem;letter-spacing:.12em}
.unit b{font-size:1.5rem}
.brand h1{margin:0;font:800 1.15rem/1.1 var(--display);color:var(--blue);letter-spacing:.02em;text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ibtn{border:1.5px solid var(--line);background:var(--paper-2);border-radius:999px;min-width:38px;height:38px;padding:0 11px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn[aria-pressed="false"]{opacity:.6}
.ibtn:hover{border-color:var(--accent)}

/* tabs */
.tabs{max-width:900px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin;position:relative;z-index:2}
.tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--paper);
  border-radius:10px 10px 4px 4px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:.92rem;white-space:nowrap;box-shadow:0 3px 8px -5px var(--shadow)}
.tabs button i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* book */
.bookwrap{max-width:900px;margin:6px auto 36px;perspective:2400px;position:relative;z-index:2;scroll-margin-top:90px}
.book{position:relative}
.book::before{content:"";position:absolute;inset:7px -9px -9px 5px;border-radius:4px 12px 12px 4px;z-index:0;
  background:repeating-linear-gradient(90deg,var(--edge1) 0 2px,var(--edge2) 2px 4px);box-shadow:0 16px 30px -12px var(--shadow)}
.sheet{position:relative;z-index:1;background:var(--paper);border-radius:4px 12px 12px 4px;min-height:72vh;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0))}
.book:not(.open) .sheet{max-height:72vh}
.cover{position:absolute;inset:0;z-index:10;transform-origin:left center;transform:perspective(2200px) rotateY(0deg);will-change:transform;transition:transform 1.25s cubic-bezier(.55,.05,.25,1),opacity .3s 1s;
  border-radius:4px 14px 14px 4px;background:var(--cover);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;padding:24px;text-align:center;
  backface-visibility:hidden;box-shadow:inset 0 0 0 6px rgba(255,255,255,.12),0 10px 30px -10px var(--shadow)}
.book.open .cover{transform:perspective(2200px) rotateY(-170deg);opacity:0;pointer-events:none}
.cover .ctitle{font:800 clamp(2.2rem,9vw,4.2rem)/1 var(--display);letter-spacing:.04em;margin:8px 0 14px}
.cover .badge{display:inline-block;background:var(--accent);color:#fff;padding:6px 18px 10px;font:800 3rem/1 var(--display);border-radius:4px}
.cover .badge small{display:block;font-size:.8rem;letter-spacing:.2em}
.cover q{display:block;max-width:34ch;margin:0 auto 18px;font-style:italic;opacity:.92}
.cover .open-hint{font-weight:700;border:2px solid #fff;border-radius:999px;padding:7px 20px;display:inline-block}

/* page content */
.hero{height:clamp(120px,24vw,200px);overflow:hidden;position:relative;border-bottom:3px solid var(--line)}
.hero svg{width:100%;height:100%;display:block}
.pg{padding:22px clamp(18px,4.5vw,44px) 26px clamp(26px,5vw,52px)}
.kicker{margin:0;font:700 .78rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pg h2{margin:2px 0 4px;font:800 clamp(1.7rem,5vw,2.4rem)/1.1 var(--display);color:var(--blue);text-wrap:balance}
.pg h3{margin:22px 0 8px;font:800 1.2rem/1.2 var(--display);color:var(--blue);text-wrap:balance}
.title-ml{margin:0 0 14px;font-family:var(--mlf);color:var(--ml-ink);font-weight:600}
.hint{background:var(--warn-bg);border-radius:10px;padding:9px 13px;font-size:.92rem;margin:10px 0 16px}
.line{margin:0 0 10px;max-width:65ch}
.line .en{margin:0;font-size:1.18rem;line-height:1.75;cursor:pointer;border-radius:8px;padding:2px 6px;margin-left:-6px}
.line .en:hover{background:var(--hl)}
.line .en[aria-expanded="true"]{background:var(--hl)}
.line .ml{margin:2px 0 4px;padding:8px 12px;background:var(--ml-bg);color:var(--ml-ink);border-radius:8px;font-family:var(--mlf);font-size:1.05rem;line-height:1.8;max-width:65ch}
.spk{font-weight:700;color:var(--accent);margin-right:6px}
.tools{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
.mini{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font:600 .85rem var(--mlf);padding:0}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.w{border-bottom:2px dotted var(--accent);cursor:help;border-radius:2px}
.w:hover,.w.on{background:var(--hl)}
#tip{position:fixed;z-index:60;max-width:min(300px,86vw);background:var(--tip-bg);color:var(--tip-ink);border-radius:10px;padding:9px 13px;pointer-events:none;
  box-shadow:0 10px 26px -8px rgba(0,0,0,.55);opacity:0;transition:opacity .12s;font-size:.95rem;line-height:1.45}
#tip.show{opacity:1}
#tip b{font:800 1.05rem var(--display)}
#tip .tml{font-family:var(--mlf);font-size:1.12rem;font-weight:600;margin-top:2px}
#tip .ten{opacity:.85;font-size:.86rem}
.think{margin-top:20px;border:2px solid var(--orange);border-radius:12px;padding:12px 14px;background:var(--paper-2)}
.think .line{margin-bottom:6px}
.think .line .en{font-weight:700;font-size:1.1rem}

/* writing + results */
.fl{display:block;font-weight:700;font-size:.9rem;margin:8px 0 3px}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;line-height:1.5}
textarea{resize:vertical;min-height:90px;background-image:repeating-linear-gradient(transparent 0 1.55em,var(--line) 1.55em calc(1.55em + 1px));background-attachment:local}
select{width:auto;max-width:100%}
.wrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}
.res{margin-top:6px}
.res:empty{display:none}
.res .sum{font-weight:700;padding:8px 12px;border-radius:8px;background:var(--paper-2)}
.res .ok{color:var(--good)}
.item{border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--paper)}
.item.good{border-left-color:var(--good);background:var(--good-bg)}
.item.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.item .why{font-size:.95rem}
.item .whyml{font-family:var(--mlf);color:var(--ml-ink);font-size:1rem;margin-top:2px}
.item del{color:var(--bad);text-decoration-thickness:2px}
.item ins{color:var(--good);font-weight:700;text-decoration:none;border-bottom:2px solid var(--good)}
.fixed{padding:10px 12px;border-radius:8px;background:var(--good-bg);margin:8px 0;white-space:pre-wrap}
.fixed del{color:var(--bad)} .fixed ins{color:var(--good);font-weight:700;text-decoration:none;border-bottom:2px solid var(--good)}
.src{font-size:.82rem;color:var(--muted);margin:4px 0}

/* activities */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips button{border:1.5px solid var(--line);background:var(--paper-2);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:.88rem}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.card{border:2px solid var(--blue);border-radius:14px;margin:0 0 22px;overflow:hidden;background:var(--paper);scroll-margin-top:100px}
.card>header{display:flex;gap:12px;align-items:center;background:var(--blue);color:#fff;padding:9px 14px}
:root[data-theme="dark"] .card>header{color:#10142a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card>header{color:#10142a}}
.card>header b{font:800 1.05rem var(--display);white-space:nowrap}
.card>header span{font-size:.98rem}
.card .cb{padding:12px 14px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper-2)}
.cell .nm{font-weight:700;margin-bottom:4px}
.scroll-x{overflow-x:auto}
details.key{border:2px dashed var(--accent);border-radius:10px;padding:6px 12px;margin:10px 0;background:var(--paper)}
details.key summary{cursor:pointer;font-weight:700;color:var(--accent)}
.t-only{display:none}
body.teacher .t-only{display:block}
body.teacher .tabs .t-only{display:inline-flex}
.tbox{border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin:18px 0;background:var(--paper-2)}
.tbox h4{margin:0 0 4px;font:800 1rem var(--display);color:var(--accent)}
.tbox ul{margin:4px 0 0;padding-left:1.2em}
.sample{font-size:.95rem}
.picprev{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;display:block}
.lazy-note{font-size:.88rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--paper-2)}
.wcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper-2);display:flex;flex-direction:column;gap:2px}
.wcard h4{margin:0;font:800 1.15rem var(--display);color:var(--blue);display:flex;justify-content:space-between;gap:8px;align-items:center}
.wcard .m{font-family:var(--mlf);font-weight:600;color:var(--ml-ink);font-size:1.1rem}
.wcard .e{font-size:.92rem;color:var(--muted)}
.wcard .add{align-self:flex-start;margin-top:6px;font-size:.82rem;padding:3px 11px}
.panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.panel{border:3px solid var(--orange);border-radius:6px;background:var(--paper);overflow:hidden}
.panel svg{display:block;width:100%;height:auto}
.panel .pt{padding:8px 10px}
.bankgroup{margin:10px 0}
.bankgroup h4{margin:0 0 4px;font:800 1.3rem var(--display);color:var(--accent)}
.bi{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
.bi b{font-size:1.05rem} .bi .m{font-family:var(--mlf);color:var(--ml-ink)}
.bi .x{margin-left:auto}
.hide-svg{width:100%;max-width:560px;height:auto;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.fl-shape{cursor:pointer}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pal button{width:34px;height:34px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--ink);cursor:pointer}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:2px solid var(--line);padding:12px clamp(18px,4.5vw,44px);background:var(--paper-2)}
.nav .pn{font-weight:700;color:var(--muted);font-size:.9rem}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);padding:9px 16px;border-radius:999px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700}
.toast.show{opacity:1}
@media (max-width:560px){
  .top{margin-top:6px}
  .brand h1{font-size:1rem}
  .line .en{font-size:1.1rem}
  .pg{padding-left:22px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

html{scroll-behavior:smooth}
/* page turn */
.leaf{position:absolute;left:0;right:0;top:0;height:min(100%,112vh);z-index:8;display:none;pointer-events:none;transform-origin:left center;transform-style:preserve-3d;will-change:transform,opacity}
.leaf.prev{transform-origin:right center}
.leaf .lf,.leaf .lb{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 12px 12px 4px}
.leaf .lf{background:var(--paper);box-shadow:0 0 36px rgba(0,0,0,.28)}
.leaf .lf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 38%,rgba(255,255,255,.05));pointer-events:none}
.leaf .lb{transform:rotateY(180deg);background:linear-gradient(270deg,var(--paper-2),var(--paper));box-shadow:0 0 36px rgba(0,0,0,.28)}
.leaf.prev .lf::after{background:linear-gradient(270deg,rgba(0,0,0,.2),rgba(0,0,0,0) 38%)}
/* the turning page must not replay entrance animations */
.leaf .hero,.leaf .pg>*{animation:none!important}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.hero{animation:fadein .6s ease .2s both}
.pg>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*45ms + .12s)}
.pg>*:nth-child(1){--d:0}.pg>*:nth-child(2){--d:1}.pg>*:nth-child(3){--d:2}.pg>*:nth-child(4){--d:3}.pg>*:nth-child(5){--d:4}.pg>*:nth-child(6){--d:5}.pg>*:nth-child(n+7){--d:6}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

/* help for slow learners */
details.help{border:2px solid var(--lime);background:var(--paper-2);border-radius:12px;padding:6px 12px;margin:0 0 12px}
details.help>summary{cursor:pointer;font-weight:700;color:var(--blue);display:flex;gap:8px;align-items:baseline}
details.help>summary span[lang]{font-family:var(--mlf);font-weight:600;color:var(--ml-ink)}
details.help ul{margin:6px 0;padding-left:1.2em}
.clue{display:none;margin:2px 0 6px;font-size:.9rem;color:var(--muted);background:var(--warn-bg);border-radius:8px;padding:3px 9px}
body.easy .clue{display:block}
.chips .chip-w,.chip-w{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;gap:6px;align-items:baseline}
.chip-w small{font-family:var(--mlf);font-weight:600;color:var(--ml-ink)}
.chip-w:hover{border-color:var(--accent);color:var(--accent)}
.ibtn#b-easy[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#1f2a44;opacity:1}

/* Activity 1 */
.a1grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.colh{margin:0 0 8px;font:800 1rem var(--display);color:var(--blue)}
.colh small{font:400 .8rem var(--body);color:var(--muted)}
.pgrid,.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sgrid{grid-template-columns:1fr}
.pcard{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard svg{width:100%;height:auto;max-width:110px;display:block}
.pcard .cap{font-weight:700}
.pcard:hover,.scard:hover{transform:translateY(-3px);box-shadow:0 8px 16px -8px var(--shadow)}

const sceneLayers={};

function lookup(w){
  const l=w.toLowerCase().replace(/’/g,"'");
  if(DICT[l])return[l,DICT[l]];
  const tries=[];
  if(/ies$/.test(l))tries.push(l.slice(0,-3)+'y');
  if(/(es|ed)$/.test(l))tries.push(l.slice(0,-2));
  if(/s$/.test(l))tries.push(l.slice(0,-1));
  if(/d$/.test(l))tries.push(l.slice(0,-1));
  if(/ing$/.test(l)){tries.push(l.slice(0,-3));tries.push(l.slice(0,-3)+'e');if(/(.)\1ing$/.test(l))tries.push(l.slice(0,-4))}
  if(/ied$/.test(l))tries.push(l.slice(0,-3)+'y');
  if(/er$/.test(l))tries.push(l.slice(0,-2));
  for(const t of tries){if(DICT[t])return[t,DICT[t]]}
  return null;
}
const PH='heart melted|welled up|well up|fed up|hind legs';
const WRE=new RegExp('('+PH+')|([A-Za-z]+(?:[\\u2019\'][a-z]+)?)','gi');
function wrap(txt){
  let out='',last=0,m;WRE.lastIndex=0;
  while((m=WRE.exec(txt))){
    out+=esc(txt.slice(last,m.index));last=m.index+m[0].length;
    let k=m[1]?m[1].toLowerCase().replace('welled up','well up'):null,hit=null;
    if(k){hit=[k,DICT[k]]}else{hit=lookup(m[2])}
    if(hit&&hit[1])out+=`<span class="w" data-w="${esc(hit[0])}" data-f="${esc(m[0])}">${esc(m[0])}</span>`;else out+=esc(m[0]);
  }
  return out+esc(txt.slice(last));
}
function lineHTML(en,ml,who){

}

 tn:['Before reading: show the title and ask, “What does a puppy like to do after a big meal?”','Read aloud once, then let pupils hover over the highlighted words (buzz, irritate, annoy).','Pause at the question and take two or three predictions before moving on.','Value: respecting another person’s rest and space.']},
s2:{title:'The Chase',ml:'ഓട്ടം',scene:'chase',
 lines:[
  ["Rocky saw a cat chasing a squirrel.","ഒരു പൂച്ച അണ്ണാനെ ഓടിക്കുന്നത് റോക്കി കണ്ടു."],
  ["He thought of having some fun.","അവൻ കുറച്ച് രസിക്കാമെന്ന് വിചാരിച്ചു."],
  ["He chased the cat.","അവൻ പൂച്ചയെ ഓടിച്ചു."],
  ["“Leave me, let me catch the squirrel,” the cat hissed at him.","“എന്നെ വിട്, ഞാൻ അണ്ണാനെ പിടിക്കട്ടെ,” പൂച്ച അവനോട് ചീറ്റി."],
  ["By then, the squirrel had climbed up a tree.","അപ്പോഴേക്കും അണ്ണാൻ ഒരു മരത്തിൽ കയറിയിരുന്നു."],
  ["“Chill, Chill, Chill,” it mocked the cat.","“ചിൽ, ചിൽ, ചിൽ,” അത് പൂച്ചയെ പരിഹസിച്ചു."],
  ["The cat also climbed up.","പൂച്ചയും മുകളിലേക്ക് കയറി."],
  ["Rocky stood below and looked at the cat.","റോക്കി താഴെ നിന്ന് പൂച്ചയെ നോക്കി."]],
 q:["What will the cat say to Rocky?","പൂച്ച റോക്കിയോട് എന്തു പറയും?"],
 tn:['Role-play in threes: cat, squirrel and Rocky. Let pupils say the lines with the right sounds (hissed, mocked).','For the question, accept any sensible reply, for example “Why did you chase me? I was chasing the squirrel.”','Discuss: is it fun when someone disturbs us? Link back to the unit idea of living in harmony.']},
s3:{title:'The Caring Crow',ml:'കരുതലുള്ള കാക്ക',scene:'caring',
 lines:[
  ["The squirrel disappeared among the leaves.","അണ്ണാൻ ഇലകൾക്കിടയിൽ മറഞ്ഞു."],
  ["The cat looked down.","പൂച്ച താഴേക്ക് നോക്കി."],
  ["He saw Rocky trying to climb up the tree.","റോക്കി മരത്തിൽ കയറാൻ ശ്രമിക്കുന്നത് അവൻ കണ്ടു."],
  ["The cat jumped down and escaped.","പൂച്ച താഴേക്ക് ചാടി രക്ഷപ്പെട്ടു."],
  ["The crow saw it.","കാക്ക അത് കണ്ടു."],
  ["Her nest was on that tree.","അവളുടെ കൂട് ആ മരത്തിലായിരുന്നു."],
  ["Her chicks were in it.","അവളുടെ കുഞ്ഞുങ്ങൾ അതിലുണ്ടായിരുന്നു."],
  ["She was afraid. She started circling around Rocky.","അവൾ പേടിച്ചു. അവൾ റോക്കിക്കു ചുറ്റും വട്ടമിട്ടു പറക്കാൻ തുടങ്ങി."],
  ["Rocky stood up on his hind legs.","റോക്കി പിൻകാലുകളിൽ എഴുന്നേറ്റു നിന്നു."]],
 q:["What will happen next?","അടുത്തതായി എന്തു സംഭവിക്കും?"],
 tn:['Ask why the crow was afraid. Pupils should link “nest”, “chicks” and “that tree”.','Empathy talk: how does a mother feel when her babies may be in danger?','Notice that Rocky only wanted to climb; the crow guessed wrongly. Talk about understanding before we judge.']},
s4:{title:'The Hungry Crow',ml:'വിശന്ന കാക്ക',scene:'hungry',
 lines:[
  ["Rocky walked back.","റോക്കി തിരിച്ചു നടന്നു."],
  ["On the way, he got a bone.","വഴിയിൽ അവന് ഒരു എല്ല് കിട്ടി."],
  ["He sat on the grass and started chewing it.","അവൻ പുല്ലിൽ ഇരുന്ന് അത് ചവച്ചു തുടങ്ങി."],
  ["“Wah! Munchy! Whoosh!” He closed his eyes in joy.","“വാഹ്! മഞ്ചി! വൂഷ്!” സന്തോഷം കൊണ്ട് അവൻ കണ്ണടച്ചു."],
  ["The crow was observing the scene. She was very hungry.","കാക്ക ഈ രംഗം നിരീക്ഷിക്കുകയായിരുന്നു. അവൾക്ക് നല്ല വിശപ്പുണ്ടായിരുന്നു."],
  ["She snatched the bone and flew away.","അവൾ എല്ല് തട്ടിയെടുത്ത് പറന്നുപോയി."],
  ["“Oh, you naughty crow,” Rocky barked.","“ഓ, വികൃതി കാക്കേ,” റോക്കി കുരച്ചു."],
  ["He did not know what to do.","എന്തു ചെയ്യണമെന്ന് അവന് അറിയില്ലായിരുന്നു."],
  ["He jumped up and down several times.","അവൻ പലതവണ മുകളിലേക്കും താഴേക്കും ചാടി."],
  ["He scratched his head and rolled in the mud.","അവൻ തല മാന്തി, ചെളിയിൽ കിടന്നുരുണ്ടു."],
  ["Slowly, he calmed down.","പതുക്കെ, അവൻ ശാന്തനായി."]],
 q:["Rocky barked aloud and jumped up and down several times. Why?","റോക്കി ഉറക്കെ കുരയ്ക്കുകയും പലതവണ ചാടുകയും ചെയ്തു. എന്തുകൊണ്ട്?"],
 tn:['Cause and effect: why did Rocky bark and jump? Draw a two-box chart on the board (cause, feeling, action).','Ask what Rocky did to calm down, and what pupils do when they feel angry.','Vocabulary to act out: snatch, scratch, chew, munch.']},
s5:{title:'The Heavy Rain',ml:'കനത്ത മഴ',scene:'rain',
 lines:[
  ["Suddenly, the blue sky grew dark.","പെട്ടെന്ന്, നീലാകാശം ഇരുണ്ടു."],
  ["The wind howled.","കാറ്റ് ഓരിയിട്ടു."],
  ["A heavy thunder shook the ground.","ഒരു വലിയ ഇടി നിലത്തെ കുലുക്കി."],
  ["It started to rain.","മഴ പെയ്യാൻ തുടങ്ങി."],
  ["“Kraa, Kraa...” the crow cawed aloud.","“ക്രാ, ക്രാ...” കാക്ക ഉറക്കെ കരഞ്ഞു."],
  ["She saw her nest swaying in the wind.","തന്റെ കൂട് കാറ്റിൽ ആടുന്നത് അവൾ കണ്ടു."],
  ["Soon the branch broke and the nest fell down.","താമസിയാതെ കൊമ്പ് ഒടിഞ്ഞ് കൂട് താഴെ വീണു."]],
 q:["What will happen to the chicks?","കുഞ്ഞുങ്ങൾക്ക് എന്തു സംഭവിക്കും?"],
 tn:['Weather words: dark, wind, thunder, rain. Ask pupils to make the sounds as you read.','Let pupils predict the chicks’ fate and give a reason for each prediction.','Point out how the colours of the page change with the mood of the story.']},
s6:{title:'Helping the Helpless',ml:'നിസ്സഹായരെ സഹായിക്കൽ',scene:'help',
 lines:[
  ["“Keeyo... Keeyo,” Rocky heard a sound.","“കീയോ... കീയോ,” റോക്കി ഒരു ശബ്ദം കേട്ടു."],
  ["He saw the chicks lying on the ground.","കുഞ്ഞുങ്ങൾ നിലത്തു കിടക്കുന്നത് അവൻ കണ്ടു."],
  ["He felt pity for them and walked towards the nest.","അവന് അവരോട് സഹതാപം തോന്നി, അവൻ കൂടിന്റെ അടുത്തേക്ക് നടന്നു."],
  ["The chicks were drenched in the rain.","കുഞ്ഞുങ്ങൾ മഴയിൽ നനഞ്ഞുകുതിർന്നിരുന്നു."],
  ["“Keeyo... Keeyo,” their cry became louder. They were shivering.","“കീയോ... കീയോ,” അവരുടെ കരച്ചിൽ ഉച്ചത്തിലായി. അവർ വിറയ്ക്കുകയായിരുന്നു."],
  ["“Don’t worry dears,” Rocky consoled them.","“പേടിക്കേണ്ട കുട്ടികളേ,” റോക്കി അവരെ ആശ്വസിപ്പിച്ചു."],
  ["“Help me, help me.” Rocky heard a cry.","“എന്നെ സഹായിക്കൂ, സഹായിക്കൂ.” റോക്കി ഒരു നിലവിളി കേട്ടു."],
  ["He turned towards the sound.","അവൻ ശബ്ദം കേട്ട ഭാഗത്തേക്ക് തിരിഞ്ഞു."],
  ["He saw the mother crow caught under a fallen branch.","വീണുകിടന്ന ഒരു കൊമ്പിനടിയിൽ കുടുങ്ങിയ അമ്മക്കാക്കയെ അവൻ കണ്ടു."],
  ["His heart melted.","അവന്റെ മനസ്സലിഞ്ഞു."],
  ["Rocky tried to move the branch. It was heavy.","റോക്കി കൊമ്പ് നീക്കാൻ ശ്രമിച്ചു. അത് ഭാരമുള്ളതായിരുന്നു."],
  ["He pulled it with all his strength.","അവൻ തന്റെ എല്ലാ ശക്തിയും ഉപയോഗിച്ച് അത് വലിച്ചു."],
  ["Finally, he was able to move it and save the crow.","ഒടുവിൽ, അവന് അത് നീക്കി കാക്കയെ രക്ഷിക്കാൻ കഴിഞ്ഞു."],
  ["The crow’s eyes welled up. She looked at Rocky with gratitude.","കാക്കയുടെ കണ്ണുകൾ നിറഞ്ഞു. അവൾ നന്ദിയോടെ റോക്കിയെ നോക്കി."],
  ["“Take care,” said Rocky and walked away.","“സൂക്ഷിക്കണേ,” എന്ന് പറഞ്ഞ് റോക്കി നടന്നുപോയി."]],
 q:["What would you do if you were in Rocky’s place?","നിങ്ങൾ റോക്കിയുടെ സ്ഥാനത്തായിരുന്നെങ്കിൽ എന്തു ചെയ്യുമായിരുന്നു?"],
 tn:['Heart of the unit: Rocky helps the crow even though she took his bone. Ask pupils why he could forgive.','Link to Fundamental Duty 51A(g), compassion for living creatures, and to the unit quote about thinking, saying and doing in harmony.','For the closing question accept reasoned answers, including “I would also help” and “I would first call an elder”.']}
};
const ORDER_STORY=['s1','s2','s3','s4','s5','s6'];

/* ---------- page pieces ---------- */
function hero(name){return `<div class="hero">${scene(name,true)}</div>`}
function tbox(title,items){return `<div class="tbox t-only"><h4>${title}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`}
const HOWTO='Hover over a dotted word to see its Malayalam meaning and hear it. Click a sentence to see its Malayalam meaning below it. Click again to hide it. On a phone, tap a word, or use the speaker and <span lang="ml">മ</span> buttons.';
function storyPage(id){
  const s=STORIES[id];
  return hero(s.scene)+`<div class="pg"><p class="kicker">Story &middot; Unit 3</p><h2>${esc(s.title)}</h2><p class="title-ml" lang="ml">${s.ml}</p>
  <div class="hint">${HOWTO}</div>
  <div class="text">${s.lines.map((l,i)=>lineHTML(l[0],l[1])).join('')}</div>
  <div class="think"><span class="kicker">Think and write</span>${lineHTML(s.q[0],s.q[1])}${wbox(id+'_q',{rows:3,ph:'Write your answer here…',ctx:'Question about the story: '+s.q[0]})}</div>
  ${mcqHTML(id)}
  ${tbox('Teacher notes',s.tn)}</div>`;
}

/* ---------- intro (curtain raiser) ---------- */

function introPage(){
  const leaf=(x,y,r)=>`<path d="M${x} ${y}q18-30 44-10q-6 32-44 10z" transform="rotate(${r} ${x} ${y})" fill="none" stroke="var(--muted)" stroke-width="1.6" opacity=".7"/>`;
  const svg=`<svg class="hide-svg" id="hidden" viewBox="0 0 400 300" role="img" aria-label="A drawing with a puppy, a crow, a squirrel and a bee hidden among leaves. Click a shape to colour it.">
  ${leaf(30,40,-20)}${leaf(90,30,40)}${leaf(330,50,10)}${leaf(360,120,70)}${leaf(20,150,10)}${leaf(220,40,-30)}${leaf(130,150,-60)}${leaf(250,160,30)}${leaf(60,270,-10)}${leaf(340,270,-40)}
  <g stroke="var(--ink)" stroke-width="2" fill="var(--paper)">
   <g id="h-puppy"><ellipse class="fl-shape" cx="115" cy="232" rx="62" ry="28"/><circle class="fl-shape" cx="60" cy="208" r="27"/><ellipse class="fl-shape" cx="40" cy="198" rx="10" ry="19" transform="rotate(20 40 198)"/><ellipse class="fl-shape" cx="75" cy="197" rx="9" ry="17" transform="rotate(-20 75 197)"/><circle cx="66" cy="214" r="4" fill="var(--ink)"/><path class="fl-shape" d="M172 226q28-26 20-48q-20 18-30 36z"/></g>
   <g id="h-crow"><ellipse class="fl-shape" cx="250" cy="100" rx="36" ry="19"/><circle class="fl-shape" cx="284" cy="86" r="14"/><path class="fl-shape" d="M295 83l22 7l-22 6z"/><path class="fl-shape" d="M216 100l-34 14l30 4z"/><circle cx="288" cy="83" r="2.6" fill="var(--ink)"/></g>
   <g id="h-squirrel"><ellipse class="fl-shape" cx="318" cy="222" rx="22" ry="32"/><circle class="fl-shape" cx="304" cy="184" r="15"/><path class="fl-shape" d="M338 236q44-10 28-70q-30 10-24 44z"/><circle cx="300" cy="182" r="2.6" fill="var(--ink)"/></g>
   <g id="h-bee"><ellipse class="fl-shape" cx="170" cy="76" rx="16" ry="10"/><ellipse class="fl-shape" cx="164" cy="60" rx="9" ry="6" transform="rotate(-30 164 60)"/><ellipse class="fl-shape" cx="178" cy="60" rx="9" ry="6" transform="rotate(30 178 60)"/><path d="M164 68v16M172 67v18" fill="none"/></g>
  </g></svg>`;
  const pal=`<div class="pal" role="group" aria-label="Colours">${PAL.map((c,i)=>`<button type="button" data-col="${c}" aria-label="Colour ${i+1}" aria-pressed="${i==0}" style="background:${c}"></button>`).join('')}</div>`;
  return hero('day')+`<div class="pg"><p class="kicker">Curtain raiser</p><h2>Who are hidden in this picture?</h2><p class="title-ml" lang="ml">ഈ ചിത്രത്തിൽ ആരൊക്കെയാണ് ഒളിച്ചിരിക്കുന്നത്?</p>
  <div class="hint">${HOWTO}</div>
  ${lineHTML("Happiness is when what you think, what you say and what you do are in harmony.","നിങ്ങൾ ചിന്തിക്കുന്നതും പറയുന്നതും ചെയ്യുന്നതും ഒത്തുചേരുമ്പോഴാണ് സന്തോഷം ഉണ്ടാകുന്നത്.")}
  <p class="src">Mahatma Gandhi</p>
  <h3>Find out and colour them</h3>${pal}${svg}
  <div class="t-only"><div class="tbox"><h4>Teacher: hidden in the picture</h4><ul><li>A puppy, a crow, a squirrel and a bee. Ask pupils to name each one before they colour it.</li><li>Use this to introduce the four characters they will meet in the unit.</li></ul></div></div>
  <div class="think"><span class="kicker">Tell us</span><p style="margin:6px 0 0;font-weight:700">Which animals did you find? Write a sentence.</p>${wbox('intro_q',{rows:2,ph:'I found …',ctx:'Naming animals found in a hidden picture'})}</div></div>`;
}

/* ---------- world of words ---------- */
function wordsPage(){
  const cards=GLOSS.map(g=>`<div class="wcard" data-word="${esc(g[0])}"><h4><span>${esc(g[0])}</span><button type="button" class="mini sp" aria-label="Listen to ${esc(g[0])}" data-say="${esc(g[0])}">${ICON_SPK}</button></h4><div class="m" lang="ml">${g[1]}</div><div class="e">${esc(g[2])}</div><button type="button" class="btn add" data-add="${esc(g[0])}">Add to my word bank</button></div>`).join('');
  return hero('words')+`<div class="pg"><p class="kicker">Vocabulary</p><h2>World of Words</h2><p class="title-ml" lang="ml">വാക്കുകളുടെ ലോകം</p>
  <div class="row"><label class="fl" for="wsearch" style="margin:0">Find a word</label><input type="text" id="wsearch" placeholder="Type to search" style="max-width:260px"></div>
  <div class="grid" id="wgrid" style="margin-top:12px">${cards}</div>
  ${tbox('Teacher notes',['Play “act it out”: call a word and pupils show it (sway, scratch, hiss).','Ask pupils to put the words in alphabetical order, then in a sentence of their own.','The Malayalam meanings help pupils who think first in their home language. Encourage them to say the English word aloud after hearing it.'])}</div>`;
}
/* ---------- Who is Stronger? (comic) ---------- */
function sunSVG(x,y,r,mood){
  let rays='';for(let i=0;i<10;i++){const a=i*Math.PI/5;rays+=`<line x1="${x+Math.cos(a)*(r+4)}" y1="${y+Math.sin(a)*(r+4)}" x2="${x+Math.cos(a)*(r+16)}" y2="${y+Math.sin(a)*(r+16)}"/>`}
  const mouth=mood==='angry'?`<path d="M${x-r*.35} ${y+r*.45}q${r*.35}-${r*.3} ${r*.7} 0" fill="none" stroke="#7a3b00" stroke-width="3"/>`:`<path d="M${x-r*.4} ${y+r*.25}q${r*.4} ${r*.45} ${r*.8} 0" fill="none" stroke="#7a3b00" stroke-width="3"/>`;
  return `<g><g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">${rays}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd23f" stroke="#f59e0b" stroke-width="3"/><circle cx="${x-r*.3}" cy="${y-r*.2}" r="3.5" fill="#7a3b00"/><circle cx="${x+r*.3}" cy="${y-r*.2}" r="3.5" fill="#7a3b00"/>${mouth}</g>`;
}
function windSVG(x,y,s,mood){
  const mouth=mood==='sad'?`<path d="M${x-10*s} ${y+16*s}q${10*s}-${8*s} ${20*s} 0" fill="none" stroke="#5b6475" stroke-width="3"/>`:mood==='blow'?`<ellipse cx="${x+4*s}" cy="${y+14*s}" rx="${9*s}" ry="${7*s}" fill="#5b6475"/>`:`<path d="M${x-10*s} ${y+10*s}q${10*s} ${12*s} ${20*s} 0" fill="none" stroke="#5b6475" stroke-width="3"/>`;
  return `<g><g fill="#e6ecf5" stroke="#9aa6ba" stroke-width="2.5"><circle cx="${x}" cy="${y}" r="${26*s}"/><circle cx="${x-24*s}" cy="${y+8*s}" r="${18*s}"/><circle cx="${x+22*s}" cy="${y+10*s}" r="${18*s}"/></g><path d="M${x+30*s} ${y+30*s}q${20*s} ${6*s} ${6*s} ${22*s}" fill="none" stroke="#9aa6ba" stroke-width="4" stroke-linecap="round"/><circle cx="${x-9*s}" cy="${y-4*s}" r="3" fill="#5b6475"/><circle cx="${x+9*s}" cy="${y-4*s}" r="3" fill="#5b6475"/>${mouth}</g>`;
}
function manSVG(x,y,mode){
  const shirt=mode==='off'?'#f0b98a':'#ff8c1a';
  const arms=mode==='hold'?`<path d="M${x-14} ${y+34}l28 10M${x+14} ${y+34}l-28 10" stroke="#a45a16" stroke-width="6" stroke-linecap="round"/>`:`<path d="M${x-14} ${y+30}l-14 22M${x+14} ${y+30}l14 22" stroke="${shirt}" stroke-width="7" stroke-linecap="round"/>`;
  const sweat=mode==='off'?`<g fill="#7fd3ff"><circle cx="${x-24}" cy="${y-6}" r="3"/><circle cx="${x+26}" cy="${y-2}" r="3"/><circle cx="${x+22}" cy="${y+14}" r="3"/></g>`:'';
  return `<g><circle cx="${x}" cy="${y}" r="16" fill="#e0a370" stroke="#6a3d17" stroke-width="2"/><path d="M${x-16} ${y-6}q16-18 32 0" fill="#2a1c12"/><rect x="${x-16}" y="${y+17}" width="32" height="40" rx="8" fill="${shirt}"/>${arms}<path d="M${x-8} ${y+57}l-6 28M${x+8} ${y+57}l6 28" stroke="#7b4a24" stroke-width="7" stroke-linecap="round"/>${sweat}</g>`;
}
function panelArt(kind){
  let g='';
  const ground='<rect y="136" width="300" height="44" fill="#8cc46b"/><path d="M0 150h300" stroke="#6aa350" stroke-width="2"/>';
  if(kind==='argue')g=sunSVG(220,56,28,'angry')+windSVG(80,70,1,'blow');
  if(kind==='man')g=sunSVG(240,40,22)+windSVG(70,50,.8,'blow')+manSVG(170,70,'walk');
  if(kind==='blow')g=windSVG(90,80,1.3,'blow')+'<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M150 70h60M150 90h80M150 110h50"/></g>'+manSVG(230,60,'walk');
  if(kind==='hold')g=windSVG(70,70,1.2,'blow')+'<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M120 60h60M120 80h70M120 100h50"/></g>'+manSVG(220,52,'hold');
  if(kind==='turn')g=sunSVG(200,66,36)+windSVG(70,100,.8,'sad');
  if(kind==='hot')g=sunSVG(230,42,30,'angry')+manSVG(120,56,'off');
  if(kind==='agree')g=sunSVG(220,66,28)+windSVG(80,76,1,'sad');
  if(kind==='harmony')g=sunSVG(210,66,32)+windSVG(80,80,1,'smile');
  const sky=kind==='hold'||kind==='blow'?'#b9d7ee':kind==='hot'||kind==='turn'?'#ffe2a6':'#9fd6f5';
  return `<svg viewBox="0 0 300 180" role="img" aria-label="Comic picture: ${kind}"><rect width="300" height="180" fill="${sky}"/>${ground}${g}</svg>`;
}

  const list=S.bank.slice().sort((a,b)=>a.w.toLowerCase().localeCompare(b.w.toLowerCase()));

  return Object.keys(groups).sort().map(l=>`<div class="bankgroup"><h4>${l}</h4>${groups[l].map(x=>`<div class="bi"><b>${wrap(x.w)}</b><span class="m" lang="ml">${esc(x.m||'')}</span><span>${esc(x.e||'')}</span><button type="button" class="mini sp" aria-label="Listen to ${esc(x.w)}" data-say="${esc(x.w)}">${ICON_SPK}</button><button type="button" class="btn x" style="padding:2px 10px;font-size:.8rem" data-bdel="${esc(x.w)}">Remove</button></div>`).join('')}</div>`).join('');
}

function grammarRules(text,lenient){
  const out=[];
  RULES.forEach(r=>{r.re.lastIndex=0;let m;
    while((m=r.re.exec(text))){
      if(m[0]==='')r.re.lastIndex++;
      let rep=r.mk(m,text);if(rep==null||rep===m[0])continue;
      out.push({s:m.index,e:m.index+m[0].length,found:m[0],fix:rep,code:r.code});
    }});
  if(!lenient){
    let pos=0;text.split('\n').forEach(line=>{
      const t=line.replace(/\s+$/,'');
      if(t.trim().split(/\s+/).filter(Boolean).length>=3&&!/[.!?…"”')]$/.test(t))out.push({s:pos+t.length,e:pos+t.length,found:'',fix:'.',code:'end'});
      pos+=line.length+1});
  }
  const caps=out.filter(x=>x.code==='cap'),rest=out.filter(x=>x.code!=='cap');
  rest.sort((a,b)=>a.s-b.s||b.e-a.e);
  const keep=[];let last=-1;rest.forEach(x=>{if(x.s>=last){keep.push(x);last=Math.max(last,x.e)}});
  caps.forEach(c=>{
    const o=keep.find(x=>x.s===c.s&&x.e>x.s);
    if(o){o.fix=cap1(o.fix);o.also='cap'}
    else if(!keep.some(x=>c.s>=x.s&&c.s<x.e))keep.push(c);
  });
  keep.sort((a,b)=>a.s-b.s||a.e-b.e);
  return keep;
}
function applyFixes(text,list){let o='',p=0;list.forEach(x=>{o+=text.slice(p,x.s)+x.fix;p=x.e});return o+text.slice(p)}
function diffHTML(text,list){let o='',p=0;list.forEach(x=>{o+=esc(text.slice(p,x.s));if(x.found)o+=`<del>${esc(x.found)}</del> `;o+=`<ins>${esc(x.fix)}</ins>`;p=x.e});return o+esc(text.slice(p))}
function issueCards(items){
  return items.map(x=>`<div class="item bad"><div>${x.found?`<del>${esc(x.found)}</del> &rarr; `:'Add '}<ins>${esc(x.fix)}</ins></div><div class="why"><b>Why:</b> ${esc(x.why_en)}</div><div class="whyml" lang="ml">${esc(x.why_ml)}</div></div>`).join('');

function renderRules(box,text,lenient){

Reply with ONLY valid JSON, no markdown, in this shape:
{"corrected":"the full corrected text, keeping the pupil's line breaks","issues":[{"wrong":"exact wrong words from the pupil text, or empty string if something must be added","right":"the correction","why_en":"one short, simple reason a young child can follow","why_ml":"the same reason in Malayalam"}],"praise":"one short encouraging sentence"}
If there are no mistakes, use an empty issues list and set corrected to the original text.
Pupil text:
"""
${text}
"""`;
  try{
    let data;
    if(typeof sample.json==='function'){data=await sample.json(prompt,{modelTier:'quick'})}

async function checkWriting(box){

function mcqPerm(id,qi,n){
  /* a fixed, repeatable shuffle so the right answer is not always first */
  const p=[];for(let i=0;i<n;i++)p.push(i);
  let s=(id.charCodeAt(0)*31+id.length*17+qi*13+7)%97;
  for(let i=n-1;i>0;i--){s=(s*37+11)%101;const j=s%(i+1);const t=p[i];p[i]=p[j];p[j]=t}
  return p;
}

let mvFrame=null;
function moviePage(){
  return hero('shade')+`<div class="pg"><p class="kicker">Watch and listen</p><h2>Rocky, the Puppy: Animated Story</h2><p class="title-ml" lang="ml">റോക്കി, നായ്ക്കുട്ടി: ആനിമേഷൻ കഥ</p>
  <div class="hint">Press the big play button. The story is read aloud with moving pictures. Words light up as they are read, with the Malayalam meaning below. After each part a question appears for you to think about. Use the buttons to change speed, captions or sound. On a phone, turn it sideways or press Full screen for a bigger picture.</div>
  <div class="mvbox" id="mv-host"><div class="mvload">Loading the animated story…</div></div>
  ${tbox('Teacher notes',['Show this on the classroom screen after the children have read the six parts, or before, to build interest.','Pause at each question card and take answers before pressing Continue.','Turn on “Captions: English” only for fluent readers; keep both languages on for pupils who need support.','Ask pupils to retell each part in their own words after watching.'])}</div>`;
}
function mvStop(){
  if(mvFrame){try{mvFrame.contentWindow.postMessage({mvstop:1},'*')}catch(e){}mvFrame=null}
  try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}
}
function mvTheme(){
  if(!mvFrame)return;
  const t=S.theme||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  try{mvFrame.contentWindow.postMessage({mvtheme:t},'*')}catch(e){}
}
function mvMount(){
  const host=$('#mv-host');if(!host)return;
  let html;
  try{const bin=atob(MOVIE_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);html=new TextDecoder().decode(u)}catch(e){host.innerHTML='<div class="mvload">The animated story could not load.</div>';return}
  const f=document.createElement('iframe');
  f.title='Rocky, the Puppy animated story';f.setAttribute('allow','fullscreen; autoplay');f.setAttribute('allowfullscreen','');
  f.style.height='720px';
  f.onload=mvTheme;
  host.innerHTML='';host.appendChild(f);f.srcdoc=html;mvFrame=f;
}
window.addEventListener('message',e=>{
  if(mvFrame&&e.source===mvFrame.contentWindow&&e.data&&e.data.mvh){mvFrame.style.height=Math.max(520,e.data.mvh)+'px'}
});
/* credit bookmark */
(function(){
  const b=$('#bm'),c=$('#bmcard');if(!b||!c)return;
  const set=v=>{c.classList.toggle('show',v);b.setAttribute('aria-expanded',String(v))};
  b.addEventListener('click',e=>{e.stopPropagation();set(!c.classList.contains('show'))});
  document.addEventListener('click',e=>{if(!e.target.closest('#bm,#bmcard'))set(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
  setTimeout(()=>{set(true);setTimeout(()=>set(false),3800)},1400);
})();

const visible=()=>TABS.filter(t=>!t.t||S.teacher);
let cur=null,busy=false;
function drawTabs(){
  $('#tabs').innerHTML=visible().map(t=>`<button type="button" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${t.id===cur}"><i style="background:${SC[t.scene].acc}"></i>${esc(t.label)}</button>`).join('');
  const sel=$('#tab-'+cur);if(sel&&sel.scrollIntoView)try{sel.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function restore(root){
  $$('[data-k]',root||document).forEach(el=>{const v=S.a[el.dataset.k];if(v==null)return;if(el.type==='checkbox')el.checked=!!v;else el.value=v});
}
function render(id){
  const t=TABS.find(x=>x.id===id);cur=id;
  mvStop();
  $('#page').innerHTML=t.build();
  restore($('#page'));
  const v=visible(),i=v.findIndex(x=>x.id===id);
  $('#prev').disabled=i<=0;$('#next').disabled=i>=v.length-1;
  $('#pn').textContent=`Page ${i+1} of ${v.length}`;
  drawTabs();
  if(id==='poem')POEMS.forEach(p=>renderPoemOut(p.k));
  act2Init();
  if(id==='movie')mvMount();
  $$('textarea[data-k]',$('#page')).forEach(()=>{});
  $$('img[data-pic]',$('#page'));
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function go(id,dir){
  if(busy||id===cur)return;
  const t=TABS.find(x=>x.id===id);if(!t)return;
  setScene(t.scene);hideTip();
  const bookOpen=$('#book').classList.contains('open');
  if(cur===null||reduced||!bookOpen||!('animate' in Element.prototype)){render(id);return}
  busy=true;
  const w=$('#bookwrap'),top=w.getBoundingClientRect().top+window.scrollY-84;
  if(window.scrollY>top)window.scrollTo({top:Math.max(0,top),behavior:'auto'});
  const leaf=$('#leaf'),clone=$('#page').cloneNode(true);
  clone.removeAttribute('id');$$('iframe',clone).forEach(f=>f.remove());clone.inert=true;clone.setAttribute('aria-hidden','true');
  leaf.innerHTML='';
  const front=document.createElement('div');front.className='lf';front.appendChild(clone);
  const back=document.createElement('div');back.className='lb';
  leaf.append(front,back);
  leaf.className='leaf'+(dir<0?' prev':'');leaf.style.display='block';
  render(id);
  const sg=dir<0?1:-1;
  const anim=leaf.animate([
    {transform:'perspective(2200px) rotateY(0deg)',opacity:1,offset:0},
    {transform:'perspective(2200px) rotateY('+(sg*80)+'deg)',opacity:1,offset:.5},
    {transform:'perspective(2200px) rotateY('+(sg*150)+'deg)',opacity:0,offset:1}
  ],{duration:900,easing:'cubic-bezier(.45,.05,.2,1)',fill:'forwards'});
  const done=()=>{leaf.style.display='none';leaf.innerHTML='';leaf.className='leaf';busy=false};
  anim.onfinish=done;anim.oncancel=done;
  setTimeout(()=>{if(busy)done()},1600);
}
function step(d){const v=visible(),i=v.findIndex(x=>x.id===cur),n=v[i+d];if(n)go(n.id,d)}

/* ---------- tooltip for words ---------- */
let tipT,sayT,tipEl=null;
const tip=$('#tip');
function showTip(w,speak){
  const k=w.dataset.w,d=DICT[k];if(!d)return;
  const f=w.dataset.f;
  tip.innerHTML=`<b>${esc(f)}</b>${f.toLowerCase()!==k?` <span class="ten">(${esc(k)})</span>`:''}<div class="tml" lang="ml">${d[0]}</div><div class="ten">${esc(d[1])}</div>`;
  tip.classList.add('show');
  const r=w.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),window.innerWidth-tw-8);
  let y=r.top-th-8;if(y<8)y=r.bottom+8;
  tip.style.left=x+'px';tip.style.top=y+'px';
  $$('.w.on').forEach(e=>e.classList.remove('on'));w.classList.add('on');tipEl=w;
  clearTimeout(sayT);if(speak)sayT=setTimeout(()=>say(f),fine?280:0);
}
function hideTip(){tip.classList.remove('show');clearTimeout(sayT);if(tipEl)tipEl.classList.remove('on');tipEl=null}

/* ---------- event wiring ---------- */
const pageEl=$('#page');
pageEl.addEventListener('mouseover',e=>{if(!fine)return;const w=e.target.closest('.w');if(w&&w!==tipEl)showTip(w,true)});
pageEl.addEventListener('mouseout',e=>{if(!fine)return;const w=e.target.closest('.w');if(w&&!w.contains(e.relatedTarget))hideTip()});
document.addEventListener('scroll',hideTip,{passive:true});
function toggleLine(line){
  const en=$('.en',line),ml=$('.ml',line);ml.hidden=!ml.hidden;en.setAttribute('aria-expanded',String(!ml.hidden));
}
document.addEventListener('click',e=>{
  const t=e.target;
  const w=t.closest&&t.closest('.w');
  if(w&&!fine){e.stopPropagation();showTip(w,true);return}
  if(!t.closest('.w'))hideTip();
  if(act2Click(e))return;
  let b;
  if((b=t.closest('.sp'))){e.stopPropagation();say(b.dataset.say,true);return}
  if((b=t.closest('.mb'))){e.stopPropagation();toggleLine(b.closest('.line'));return}
  if((b=t.closest('.line .en'))){toggleLine(b.closest('.line'));return}
  if((b=t.closest('[data-tab]'))){const id=b.dataset.tab,v=visible();go(id,v.findIndex(x=>x.id===id)<v.findIndex(x=>x.id===cur)?-1:1);return}
  if((b=t.closest('[data-jump]'))){const c=document.getElementById(b.dataset.jump);if(c)c.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});return}
  if((b=t.closest('[data-check]'))){const id=b.dataset.check;$('#res-'+id).innerHTML=CHK[id]();return}
  if((b=t.closest('.chk-w'))){checkWriting(b.closest('.wbox'));return}
  if((b=t.closest('.use-fix'))){const box=b.closest('.wbox');if(box._fixed!=null){const ta=$('textarea',box);ta.value=box._fixed;S.a[ta.dataset.k]=ta.value;save();$('.res',box).innerHTML='<div class="sum ok">Your text now has the corrections. Read it once more.</div>';b.hidden=true}return}
  if((b=t.closest('[data-col]'))){$$('[data-col]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');return}
  if((b=t.closest('.fl-shape'))){const c=$('[data-col][aria-pressed="true"]');b.setAttribute('fill',c?c.dataset.col:'#e53935');return}
  if((b=t.closest('#diary-add'))){S.diaryN++;save();$('#diary').innerHTML=diaryHTML();restore($('#diary'));return}
  if((b=t.closest('[data-poem]'))){renderPoemOut(b.dataset.poem);return}
  if((b=t.closest('[data-poemsay]'))){const x=(S.a[b.dataset.poemsay]||'').trim();if(x)say(x.replace(/\n+/g,'. '),true);else toast('Add the poem lines first');return}
  if((b=t.closest('[data-add]'))){addBank(b.dataset.add);return}
  if((b=t.closest('#badd'))){const w1=$('#bw').value.trim();if(!w1){toast('Type a word first');return}addBank(w1,$('#bm').value.trim(),$('#be').value.trim());['bw','bm','be'].forEach(i=>$('#'+i).value='');return}
  if((b=t.closest('#ball'))){GLOSS.forEach(g=>addBank(g[0],null,null,true));refreshBank();toast('Added the words from World of Words');return}
  if((b=t.closest('[data-bdel]'))){S.bank=S.bank.filter(x=>x.w!==b.dataset.bdel);save();refreshBank();return}
});
pageEl.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.line .en')){e.preventDefault();toggleLine(e.target.closest('.line'))}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.k){S.a[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;save()}
  if(el.id==='wsearch'){const q=el.value.trim().toLowerCase();$$('.wcard').forEach(c=>{c.style.display=(!q||c.textContent.toLowerCase().indexOf(q)>-1)?'':'none'})}
  if(el.id==='bw'){const hit=lookup(el.value.trim());const m=$('#bm'),en=$('#be');if(hit&&hit[1]&&m&&!m.dataset.touched){m.value=hit[1][0].split(',')[0];if(!en.dataset.touched)en.value=hit[1][1]}}
  if(el.id==='bm')el.dataset.touched=1;if(el.id==='be')el.dataset.touched=1;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.k){S.a[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;save()}
  if(el.dataset&&el.dataset.pic&&el.files&&el.files[0]){
    const id=el.dataset.pic,img=$('#prev-'+id),f=el.files[0];
    try{const u=URL.createObjectURL(f);img.src=u;img.hidden=false;img.alt='Picture added by the pupil'}catch(err){}
  }
});
function addBank(w,m,en,quiet){
  const key=w.toLowerCase();if(S.bank.some(x=>x.w.toLowerCase()===key)){if(!quiet)toast('Already in your word bank');return}
  const hit=DICT[key];
  S.bank.push({w:w,m:m||(hit?hit[0]:''),e:en||(hit?hit[1]:'')});save();
  if(!quiet){toast('Added “'+w+'”');refreshBank()}
}
function refreshBank(){const o=$('#bankout');if(o)o.innerHTML=bankHTML()}

/* ---------- header controls ---------- */
function applyMode(){
  document.body.classList.toggle('teacher',S.teacher);
  $('#m-student').setAttribute('aria-pressed',String(!S.teacher));
  $('#m-teacher').setAttribute('aria-pressed',String(S.teacher));
  if(!S.teacher&&cur==='teacher'){go('intro',-1)}
  drawTabs();
  const v=visible(),i=v.findIndex(x=>x.id===cur);$('#pn').textContent=`Page ${i+1} of ${v.length}`;$('#next').disabled=i>=v.length-1;
}
$('#m-student').onclick=()=>{S.teacher=false;save();applyMode();toast('Student version')};
$('#m-teacher').onclick=()=>{S.teacher=true;save();applyMode();toast('Teacher version: answer keys and Teacher Guide shown')};
function applyEasy(){
  const b=$('#b-easy');b.setAttribute('aria-pressed',String(!!S.easy));b.textContent=S.easy?'Easy support on':'Easy support';
  document.body.classList.toggle('easy',!!S.easy);
  $$('details.help').forEach(d=>{d.open=!!S.easy});
}
$('#b-easy').onclick=()=>{S.easy=!S.easy;save();applyEasy();toast(S.easy?'Easy support is on: help panels are open':'Easy support is off')};
function applySound(){const b=$('#b-sound');b.setAttribute('aria-pressed',String(S.sound));b.textContent=S.sound?'Sound on':'Sound off'}
$('#b-sound').onclick=()=>{S.sound=!S.sound;save();applySound();if(!S.sound&&'speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}};
function applySize(){document.documentElement.style.setProperty('--fs',S.fs)}
$('#b-inc').onclick=()=>{S.fs=Math.min(1.5,Math.round((S.fs+.1)*10)/10);save();applySize()};
$('#b-dec').onclick=()=>{S.fs=Math.max(.9,Math.round((S.fs-.1)*10)/10);save();applySize()};
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');mvTheme();$('#b-theme').textContent=S.theme==='dark'?'Dark':S.theme==='light'?'Light':'Auto'}
$('#b-theme').onclick=()=>{S.theme=S.theme===''?'light':S.theme==='light'?'dark':'';save();applyTheme()};
$('#prev').onclick=()=>step(-1);
$('#next').onclick=()=>step(1);
function openBook(){
  const b=$('#book');if(b.classList.contains('open'))return;
  b.classList.add('open');setTimeout(()=>{try{$('#page').focus({preventScroll:true})}catch(e){}},900);
  if('speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
}
$('#cover').onclick=openBook;
$('#b-close').onclick=()=>{$('#book').classList.remove('open');window.scrollTo({top:0,behavior:'auto'})};
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(!$('#book').classList.contains('open'))return;
  if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
});

/* ---------- start ---------- */
applySound();applySize();applyTheme();applyEasy();
let first='intro';
try{const h=location.hash.replace('#','');if(TABS.some(t=>t.id===h&&(!t.t||S.teacher)))first=h}catch(e){}
setScene(TABS.find(t=>t.id===first).scene);
render(first);
applyMode();
if(first!=='intro')$('#book').classList.add('open');
})();
</script>

</body></html>
